name: costume-local-test

x-studio-db-url: &studio-db-url postgresql://costume_test:${LOCAL_TEST_DB_PASSWORD:?Run local-test/start.ps1 first}@db:5432/costume_local_test?schema=public
x-api-build: &api-build
  context: .
  dockerfile: apps/api/Dockerfile

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: costume_test
      POSTGRES_PASSWORD: ${LOCAL_TEST_DB_PASSWORD:?Run local-test/start.ps1 first}
      POSTGRES_DB: costume_local_test
    volumes:
      - studio_db:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:${LOCAL_TEST_DB_PORT:-55432}:5432
    healthcheck:
      test: [CMD-SHELL, pg_isready -U costume_test -d costume_local_test]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      <<: *api-build
      target: production
    environment:
      NODE_ENV: development
      DATABASE_URL: *studio-db-url
    command: [./node_modules/.bin/prisma, migrate, deploy]
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  seed:
    build:
      <<: *api-build
      target: build
    environment:
      NODE_ENV: development
      DATABASE_URL: *studio-db-url
      SEED_PROFILE: demo
      LOCAL_TEST_SEED: 'true'
      LOCAL_TEST_ACCOUNT_PASSWORD: ${LOCAL_TEST_ACCOUNT_PASSWORD:?Run local-test/start.ps1 first}
    volumes:
      - ./local-test/seed-once.mjs:/app/apps/api/seed-once.mjs:ro
    command: [node, /app/apps/api/seed-once.mjs]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: 'no'

  s3:
    image: chrislusf/seaweedfs@sha256:4b42c212543a0acd4c0e675215ecdcaf62a186ef98def76c7e12701871222d15
    command: mini -dir=/data -s3.allowedOrigins=http://localhost:${LOCAL_TEST_WEB_PORT:-5180}
    environment:
      AWS_ACCESS_KEY_ID: localtest
      AWS_SECRET_ACCESS_KEY: ${LOCAL_TEST_S3_PASSWORD:?Run local-test/start.ps1 first}
      S3_BUCKET: costume-media-local
    volumes:
      - object_store:/data
    ports:
      - 127.0.0.1:${LOCAL_TEST_S3_PORT:-59000}:8333
    restart: unless-stopped

  s3-init:
    build:
      <<: *api-build
      target: production
    environment:
      S3_ENDPOINT: http://s3:8333
      S3_REGION: us-east-1
      S3_BUCKET: costume-media-local
      S3_ACCESS_KEY_ID: localtest
      S3_SECRET_ACCESS_KEY: ${LOCAL_TEST_S3_PASSWORD:?Run local-test/start.ps1 first}
    volumes:
      - ./local-test/init-s3.mjs:/app/init-s3.mjs:ro
      - ./local-test/seed-s3-images.mjs:/app/seed-s3-images.mjs:ro
      - ./local-test/check-s3.mjs:/app/check-s3.mjs:ro
    command:
      [sh, -c, 'node /app/init-s3.mjs && node /app/seed-s3-images.mjs && node /app/check-s3.mjs']
    depends_on:
      s3:
        condition: service_started
    restart: 'no'

  api:
    build:
      <<: *api-build
      target: production
    environment:
      NODE_ENV: development
      PORT: '4000'
      WEB_URL: http://localhost:${LOCAL_TEST_WEB_PORT:-5180}
      WEB_ALLOWED_ORIGINS: http://localhost:${LOCAL_TEST_WEB_PORT:-5180}
      LOG_LEVEL: info
      DATABASE_URL: *studio-db-url
      JWT_ACCESS_SECRET: ${LOCAL_TEST_JWT_SECRET:?Run local-test/start.ps1 first}
      OTP_HASH_SECRET: ${LOCAL_TEST_OTP_SECRET:?Run local-test/start.ps1 first}
      OTP_DELIVERY_MODE: disabled
      S3_ENDPOINT: http://s3:8333
      S3_PUBLIC_ENDPOINT: http://localhost:${LOCAL_TEST_S3_PORT:-59000}
      S3_REGION: us-east-1
      S3_BUCKET: costume-media-local
      S3_ACCESS_KEY_ID: localtest
      S3_SECRET_ACCESS_KEY: ${LOCAL_TEST_S3_PASSWORD:?Run local-test/start.ps1 first}
      S3_FORCE_PATH_STYLE: 'true'
      MEDIA_PUBLIC_BASE_URL: http://localhost:${LOCAL_TEST_S3_PORT:-59000}/costume-media-local
      BACKGROUND_WORKER_ENABLED: 'false'
    ports:
      - 127.0.0.1:${LOCAL_TEST_API_PORT:-4180}:4000
    depends_on:
      seed:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:${LOCAL_TEST_API_PORT:-4180}
    ports:
      - 127.0.0.1:${LOCAL_TEST_WEB_PORT:-5180}:80
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  studio_db:
  object_store:
