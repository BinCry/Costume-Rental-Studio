name: Build, Test, Publish API Image

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.dockerignore'
      - '.github/workflows/api-publish.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: kietphan24/costume-rental-studio-api
  STAGING_TAG: staging

permissions:
  contents: read

concurrency:
  group: api-staging-deploy
  cancel-in-progress: true

jobs:
  staging:
    name: Build, Test, Publish API Image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run verification suite
        run: |
          pnpm --filter @costume/api lint
          pnpm --filter @costume/api typecheck
          pnpm test:api
          pnpm build:api

      - name: Validate Docker Hub configuration
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || (echo "Missing DOCKERHUB_USERNAME" && exit 1)
          test -n "$DOCKERHUB_TOKEN" || (echo "Missing DOCKERHUB_TOKEN" && exit 1)

      - name: Validate Coolify configuration
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
        run: |
          test -n "$COOLIFY_DEPLOY_WEBHOOK" || (echo "Missing COOLIFY_DEPLOY_WEBHOOK" && exit 1)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.STAGING_TAG }}
            ${{ env.IMAGE_NAME }}:staging-${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify deploy
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          if [ -n "$COOLIFY_API_TOKEN" ]; then
            if curl --fail --show-error --silent --request POST \
              -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
              "$COOLIFY_DEPLOY_WEBHOOK"; then
              exit 0
            fi

            echo "Bearer-authenticated webhook failed; retrying URL-authenticated webhook"
          fi

          curl --fail --show-error --silent --request POST \
            "$COOLIFY_DEPLOY_WEBHOOK"

      - name: Explain deploy output
        run: |
          echo "Published image:"
          echo "- ${{ env.IMAGE_NAME }}:${{ env.STAGING_TAG }}"
          echo "- ${{ env.IMAGE_NAME }}:staging-${{ steps.meta.outputs.short_sha }}"
          echo "Coolify should pull ${{ env.IMAGE_NAME }}:${{ env.STAGING_TAG }}."

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-verification-reports
          path: |
            apps/api/coverage
            apps/api/test-results
          if-no-files-found: ignore
