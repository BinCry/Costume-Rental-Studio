name: Build and Publish Web Image

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.dockerignore'
      - '.github/workflows/web-publish.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: kietphan24/costume-rental-studio-web
  STAGING_TAG: staging

permissions:
  contents: read

concurrency:
  group: web-staging-deploy
  cancel-in-progress: true

jobs:
  staging:
    name: Build, Test, Publish Web Image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify web build
        run: |
          pnpm --filter @costume/web typecheck
          pnpm --filter @costume/web build

      - name: Validate Docker Hub configuration
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || (echo "Missing DOCKERHUB_USERNAME" && exit 1)
          test -n "$DOCKERHUB_TOKEN" || (echo "Missing DOCKERHUB_TOKEN" && exit 1)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=https://studio.api.bincrydev.id.vn
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.STAGING_TAG }}
            ${{ env.IMAGE_NAME }}:staging-${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify deploy
        env:
          COOLIFY_WEB_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_WEB_DEPLOY_WEBHOOK }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEB_DEPLOY_WEBHOOK" ]; then
            echo "COOLIFY_WEB_DEPLOY_WEBHOOK is not configured; skipping Coolify deployment."
            exit 0
          fi

          if [ -n "$COOLIFY_API_TOKEN" ]; then
            if curl --fail --show-error --silent --request POST \
              -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
              "$COOLIFY_WEB_DEPLOY_WEBHOOK"; then
              exit 0
            fi

            echo "Bearer-authenticated webhook failed; retrying URL-authenticated webhook"
          fi

          curl --fail --show-error --silent --request POST \
            "$COOLIFY_WEB_DEPLOY_WEBHOOK"

      - name: Explain deploy output
        env:
          COOLIFY_WEB_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_WEB_DEPLOY_WEBHOOK }}
        run: |
          echo "Published image:"
          echo "- ${{ env.IMAGE_NAME }}:${{ env.STAGING_TAG }}"
          echo "- ${{ env.IMAGE_NAME }}:staging-${{ steps.meta.outputs.short_sha }}"
          if [ -n "$COOLIFY_WEB_DEPLOY_WEBHOOK" ]; then
            echo "Coolify deploy webhook was triggered."
          else
            echo "COOLIFY_WEB_DEPLOY_WEBHOOK is not configured; image publish completed without Coolify deployment."
          fi
